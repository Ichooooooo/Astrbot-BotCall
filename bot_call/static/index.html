<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#000000"><title>语音通话</title><link rel="stylesheet" href="/bot-call/call.css"><script type="module" src="/bot-call/page.js"></script></head>
<body>
<main id="call-shell" class="call-shell" data-phase="preparing">
<div class="glow" aria-hidden="true"><div class="glow-core"><div id="glow-orb" class="glow-orb"><i class="halo"></i><i class="disc"></i></div></div></div>
<header class="call-header">
<button id="details-open" class="icon-button" aria-label="打开通话详情" aria-controls="details" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
<div class="identity"><span id="bot-name" class="bot-name">Bot</span><span id="call-timer" class="timer" aria-label="本页通话计时">00:00</span></div>
<button id="subtitles" class="icon-button text-toggle" aria-label="隐藏文字" aria-pressed="true" aria-controls="conversation"><span class="glyph" aria-hidden="true">字</span><svg class="badge badge-on" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="6"/><path d="m3.2 6.2 1.9 1.9 3.7-3.9"/></svg><svg class="badge badge-off" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="6"/><path d="m3.4 8.6 5.2-5.2"/></svg></button>
</header>
<p id="call-state" class="sr-only" role="status" aria-live="polite">点开始通话</p>
<div class="stage"><section id="conversation" class="conversation" aria-label="通话文字" tabindex="-1"><ol id="captions" class="captions"></ol></section>
<button id="jump-latest" class="jump-latest" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m-6-6 6 6 6-6"/></svg>回到最新</button></div>
<div class="action-zone">
<p id="call-hint" class="call-hint" hidden></p>
<div class="slot">
<button id="start" class="pill">开始通话</button>
<button id="main-action" class="main-action" data-kind="idle" hidden><span id="bars" class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span id="main-label" class="main-label">准备中…</span></button>
</div>
</div>
<footer class="call-actions">
<button id="mute" class="round-button" aria-label="静音麦克风" aria-pressed="false"><svg class="mic-on" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5.5 10.5v1a6.5 6.5 0 0 0 13 0v-1M12 18v3m-3 0h6"/></svg><svg class="mic-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6V5a3 3 0 0 1 6 0v6m-6-1v2a3 3 0 0 0 4.3 2.7M5.5 10.5v1a6.5 6.5 0 0 0 10.7 5m2.3-6v1c0 .8-.1 1.5-.4 2.2M12 18v3m-3 0h6M3 3l18 18"/></svg></button>
<button id="end" class="round-button end" aria-label="挂断通话"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
</footer>
<noscript>需要 JavaScript 才能使用通话页面。</noscript>
</main>
<details id="details" class="details-overlay" role="dialog" aria-modal="true" aria-labelledby="details-title"><summary class="sr-only" tabindex="-1">通话详情</summary><div class="details-panel"><header class="panel-header"><h2 id="details-title">通话详情</h2><button id="details-close" class="icon-button" aria-label="关闭通话详情"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header><div class="panel-content">
<section class="technical" aria-label="状态与诊断"><h3>状态与诊断</h3><p id="status" role="status">尚未开始</p><p id="notice"></p><meter id="voice-level" min="0" max="1" value="0" aria-label="麦克风实时音量" hidden></meter><div class="detail-actions"><button id="retry">核查 / 重试未确认提交</button><button id="detail-stop" disabled>停止朗读</button></div></section>
<section class="technical" aria-label="声音检查"><h3>声音检查</h3><div class="detail-actions"><button id="resume-voice" disabled>恢复声音</button><button id="test-voice">试听固定样本</button></div><p id="speech-diagnostic" role="status">正在检查浏览器声音。</p><p>固定样本只测试网页播放，不录音、不调用模型，也不验证当前语音服务。计时为本页估计，不用来判定服务端结束。</p></section>
<section class="technical"><h3>通话说明</h3><p>开始后才申请麦克风。音频和回复交给 AstrBot 选用的服务处理；完整文字临时保存在服务端。未确认片段留在本页，不会自动重传，请勿直接关闭。</p><p>停止朗读不等于撤销工具操作；浏览器播完不代表你听完或接受。挂断、生成回顾、发送与接聊会分别确认。</p></section>
</div></div></details>
</body></html>
